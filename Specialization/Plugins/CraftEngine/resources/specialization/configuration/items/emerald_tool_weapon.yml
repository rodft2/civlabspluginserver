templates:
  specialization:tool/emerald:
    material: iron_${part}
    data:
      item-name: <!i><white><l10n:item.emerald_${part}>
      max-damage: ${max-damage}
      attribute-modifiers:
        - type: "minecraft:mining_efficiency"
          operation: "add_value"
          amount: ${mining_efficiency}
        - type: "minecraft:attack_damage"
          operation: "add_value"
          amount: ${attack_damage}
        - type: "minecraft:attack_speed"
          operation: "add_value"
          amount: ${attack_speed}
    settings:
      tags:
        - specialization:emerald_tools
    texture: minecraft:item/custom/emerald_${part}

items:
  specialization:emerald_pickaxe:
    template:
      - specialization:tool/emerald
    arguments:
      part: pickaxe
      max-damage: 767
      attack_damage: 4.5
      mining_efficiency: 7
      attack_speed: 1.2
