templates:
  specialization:tool/copper:
    material: stone_${part}
    data:
      item-name: <!i><white><l10n:item.copper_${part}>
      attribute-modifiers:
        - type: "minecraft:mining_efficiency"
          operation: "add_value"
          amount: ${mining_efficiency}
          max-damage: ${max-damage}
    settings:
      tags:
        - specialization:copper_tools
    texture: minecraft:item/custom/copper_${part}
items:
  specialization:copper_pickaxe:
    template:
      - specialization:tool/copper
    arguments:
      part: pickaxe
      mining_efficiency: 5
      max-damage: 190

  specialization:copper_axe:
    template:
      - specialization:tool/copper
    arguments:
      part: axe
      mining_efficiency: 5
      max-damage: 190

  specialization:copper_hoe:
    template:
      - specialization:tool/copper
    arguments:
      part: hoe
      mining_efficiency: 5
      max-damage: 190

  specialization:copper_shovel:
    template:
      - specialization:tool/copper
    arguments:
      part: shovel
      mining_efficiency: 5
      max-damage: 190

  specialization:copper_sword:
    template:
      - specialization:tool/copper
    arguments:
      part: shovel
      mining_efficiency: 1
      max-damage: 190

recipes:
  specialization:copper_shovel:
    type: shaped
    category: equipment
    pattern:
      - B
      - S
      - S
    ingredients:
      B: minecraft:copper_block
      S: minecraft:stick
    result:
      id: specialization:copper_shovel
      count: 1
  specialization:copper_axe:
    type: shaped
    category: equipment
    pattern:
      - 'CB'
      - 'CS'
      - ' S'
    ingredients:
      B: minecraft:copper_block
      C: minecraft:copper_ingot
      S: minecraft:stick
    result:
      id: specialization:copper_axe
      count: 1
  specialization:copper_sword:
    type: shaped
    category: equipment
    pattern:
      - C
      - B
      - S
    ingredients:
      B: minecraft:copper_block
      C: minecraft:copper_ingot
      S: minecraft:stick
    result:
      id: specialization:copper_sword
      count: 1
  specialization:copper_hoe:
    type: shaped
    category: equipment
    pattern:
      - 'CB'
      - ' S'
      - ' S'
    ingredients:
      B: minecraft:copper_block
      C: minecraft:copper_ingot
      S: minecraft:stick
    result:
      id: specialization:copper_hoe
      count: 1
  specialization:copper_pickaxe:
    type: shaped
    category: equipment
    pattern:
      - 'CBC'
      - ' S '
      - ' S '
    ingredients:
      B: minecraft:copper_block
      C: minecraft:copper_ingot
      S: minecraft:stick
    result:
      id: specialization:copper_pickaxe
      count: 1
translations:
  en:
    item.copper_pickaxe: Copper Pickaxe
    item.copper_axe: Copper Axe
    item.copper_hoe: Copper Hoe
    item.copper_shovel: Copper Shovel
    item.copper_sword: Copper Sword 