templates:
  specialization:armor/emerald:
    material: iron_${part}
    data:
      item-name: <!i><l10n:item.emerald_${part}>
      components:  
            minecraft:max_damage: ${maxdamage}
      attribute-modifiers:
        - type: "minecraft:armor"
          amount: ${armor}
          operation: "add_value"
          slot: ${slot}
        - type: "minecraft:generic.armor_toughness"
          operation: "add_value"
          amount: ${toughness}
    settings:
      tags:
        - specialization:emerald_tools
        - minecraft:trimmable_armor
      equipment:
        asset-id: specialization:emerald
        $$>=1.21.2:
          slot: ${slot}
    model:
      template: default:model/armor_trim
      arguments:
        texture: minecraft:item/custom/emerald_${part}
items:
  specialization:emerald_helmet:
    template:
      - specialization:armor/emerald
    arguments:
      part: helmet
      slot: head
      material: emerald
      armor: 2.5
      maxdamage: 264
      toughness: 1
  specialization:emerald_chestplate:
    template:
      - specialization:armor/emerald
    arguments:
      part: chestplate
      slot: chest
      material: emerald
      armor: 7
      maxdamage: 384
      toughness: 1
  specialization:emerald_leggings:
    template:
      - specialization:armor/emerald
    arguments:
      part: leggings
      slot: legs
      material: emerald
      armor: 5.5
      maxdamage: 360
      toughness: 1
  specialization:emerald_boots:
    template:
      - specialization:armor/emerald
    arguments:
      part: boots
      slot: feet
      material: emerald
      armor: 2.5
      maxdamage: 312
      toughness: 1
equipments:
  $$>=1.21.2:
    specialization:emerald:
      type: component
      humanoid: minecraft:emerald
      humanoid-leggings: minecraft:emerald
  $$<1.21.2:
    specialization:emerald:
      type: trim
      humanoid: minecraft:entity/equipment/humanoid/emerald
      humanoid-leggings: minecraft:entity/equipment/humanoid_leggings/emerald
recipes:
  specialization:emerald_helmet:
    type: shaped
    category: equipment
    pattern:
      - EIE
      - I I
    ingredients:
      E: minecraft:emerald
      I: specialization:emerald_nugget
    result:
      id: specialization:emerald_helmet
      count: 1
  specialization:emerald_chestplate:
    type: shaped
    category: equipment
    pattern:
      - I I
      - EIE
      - IEI
    ingredients:
      E: minecraft:emerald
      I: specialization:emerald_nugget
    result:
      id: specialization:emerald_chestplate
      count: 1
  specialization:emerald_leggings:
    type: shaped
    category: equipment
    pattern:
      - EIE
      - I I
      - I I
    ingredients:
      E: minecraft:emerald
      I: specialization:emerald_nugget
    result:
      id: specialization:emerald_leggings
      count: 1
  specialization:emerald_boots:
    type: shaped
    category: equipment
    pattern:
      - E E
      - I I
    ingredients:
      E: minecraft:emerald
      I: specialization:emerald_nugget
    result:
      id: specialization:emerald_boots
      count: 1
translations:
  en:
    item.emerald_helmet: Emerald Helmet
    item.emerald_chestplate: Emerald Chestplate
    item.emerald_leggings: Emerald Leggings
    item.emerald_boots: Emerald Boots