items:  
  specialization:musket:
    material: wooden_axe
    behaviors:
      - type: specialization:musket_behavior
        ammo: specialization:lead_shot
        reload-time: 3
        cooldown-time: 60
    settings:
      enchantable: false
    data:
      lore:
        - "<!i>Requires lead bullets to function"
        - "<!i>Deals 4.0 hearts at most"
      item-name: <!i><white><l10n:item.musket>
      max-damage: 50000
      attribute-modifiers:
        - type: "minecraft:generic.attack_damage"
          amount: -2
          operation: "add_value"
        - type: "minecraft:entity_interaction_range"
          amount: -3
          operation: "add_value"
      hide-tooltip:
        - "attribute_modifiers"
    models:  
      type: minecraft:model  
      path: minecraft:item/custom/musket
recipes:
  specialization:musket:
    type: shaped
    pattern:
      - 'F I'
      - 'TIR'
      - 'WL '
    ingredients:
      F: minecraft:flint_and_steel
      I: minecraft:iron_block
      R: minecraft:lightning_rod
      L: minecraft:lever
      W: "#minecraft:logs"
      T: minecraft:tripwire_hook
    result:
      id: specialization:musket
      count: 1
translations:
  en:
    item.musket: Musket