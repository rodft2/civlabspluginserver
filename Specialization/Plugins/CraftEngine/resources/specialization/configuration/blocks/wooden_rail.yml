items:
  specialization:wooden_rail:
    material: rail
    data:
      item-name: <!i><l10n:item.wooden_rail>
    texture: minecraft:item/wooden_rail
    behavior:
      type: block_item
      block: specialization:wooden_rail

blocks:
  specialization:wooden_rail:
    settings:
      template:
        - default:sound/wood
        - default:hardness/wood
      overrides:
        push-reaction: destroy
        replaceable: false
        item: specialization:wooden_rail
      tags:
        - minecraft:mineable/axe
    behaviors:
      - type: specialization:wooden_rail
      - type: liquid_flowable_block
      - type: sturdy_base_block
        direction: down
        support-types:
          - rigid
    state:
      properties:
        shape:
          type: int
          default: 0
          range: 0~9
        waterlogged:
          type: boolean
          default: false
      appearances:
        # --- Flat Rails ---
        north_south:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail }
        east_west:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail, y: 90 }

        # --- Raised (Sloped) Rails ---
        ascending_east:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail_raised_ne, y: 90 }
        ascending_west:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail_raised_ne, y: 270 }
        ascending_north:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail_raised_ne, y: 180 }
        ascending_south:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail_raised_ne, y: 0 }

        # --- Turned (Curved) Rails ---
        south_east:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail_curved, y: 180 }
        south_west:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail_curved, y: 270 }
        north_west:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail_curved, y: 0 }
        north_east:
          auto-state: tripwire
          model: { path: minecraft:block/wooden_rail_curved, y: 90 }
      variants:
        "shape=0": { appearance: north_south }
        "shape=1": { appearance: east_west }
        "shape=2": { appearance: ascending_east }
        "shape=3": { appearance: ascending_west }
        "shape=4": { appearance: ascending_south }
        "shape=5": { appearance: ascending_north }
        "shape=6": { appearance: north_west }
        "shape=7": { appearance: north_east }
        "shape=8": { appearance: south_east }
        "shape=9": { appearance: south_west }
recipes:
  specialization:wooden_rail:
    type: shaped
    pattern:
      - 'S S'
      - 'SWS'
      - 'S S'
    ingredients:
      S:  minecraft:stick
      W:  '#minecraft:planks'
    result:
      id: specialization:wooden_rail
      count: 8
translations:
  en:
    item.wooden_rail.name: Wooden Rail